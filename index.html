<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Binodex AI Ultimate Pro</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-green: #00c853;
            --accent-red: #ff3d00;
            --accent-blue: #2979ff;
            --accent-gold: #ffab00;
            --text-main: #ffffff;
            --text-secondary: #8a9ba8;
            --border-color: #1e293b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        html, body {
            background-color: var(--bg-color);
            color: var(--text-main);
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }
        body {
            padding: 10px;
            padding-bottom: 40px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ШАПКА */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .logo {
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }
        .logo span {
            color: var(--accent-blue);
        }
        .badge-live {
            background: rgba(0, 200, 83, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(0, 200, 83, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .pulse-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 200, 83, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(0, 200, 83, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 200, 83, 0); }
        }

        /* КАРТОЧКИ */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .section-title {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .dropdown, .input-field {
            background: #1a243b;
            border: 1px solid var(--border-color);
            color: white;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            font-size: 13px;
            font-weight: 600;
            outline: none;
        }
        
        .chart-box {
            width: 100%;
            height: 180px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: #000;
        }

        .primary-btn {
            background: linear-gradient(135deg, #00c853, #009624);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 200, 83, 0.4);
            letter-spacing: 0.5px;
            text-align: center;
            transition: transform 0.1s;
        }
        .primary-btn:active {
            transform: scale(0.98);
        }
        .primary-btn:disabled {
            background: #2a3b4c;
            color: #8a9ba8;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Кнопка НАЧАТЬ ТОРГОВАТЬ (реферальная) */
        .referral-trade-btn {
            display: block;
            background: linear-gradient(135deg, #2979ff, #1565c0);
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 900;
            font-size: 13px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(41, 121, 255, 0.4);
            cursor: pointer;
            border: none;
            width: 100%;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        .analysis-loader {
            background: #172236;
            border: 1px solid #283854;
            border-radius: 10px;
            padding: 14px;
            text-align: center;
            display: none;
        }
        .spinner {
            width: 26px;
            height: 26px;
