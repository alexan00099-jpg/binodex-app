<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binodex AI Pro Ultimate</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131823;
            --accent-green: #00c853;
            --accent-red: #ff3d00;
            --accent-blue: #2979ff;
            --accent-purple: #9c27b0;
            --text-main: #ffffff;
            --text-secondary: #8a9ba8;
            --border-color: #222b38;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 10px;
            padding-bottom: 75px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }
        .logo {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .logo span {
            color: var(--accent-blue);
        }
        .badges-header {
            display: flex;
            gap: 6px;
        }
        .badge {
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .winrate-badge {
            background: rgba(0, 200, 83, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(0, 200, 83, 0.3);
        }
        .ping-badge {
            background: rgba(41, 121, 255, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(41, 121, 255, 0.3);
        }
        .nav-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
            overflow-x: auto;
            padding-bottom: 2px;
        }
        .tab-btn {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .news-filter {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(41, 121, 255, 0.08);
            border: 1px solid rgba(41, 121, 255, 0.2);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 11px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .news-status {
            color: var(--accent-green);
            background: rgba(0, 200, 83, 0.15);
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 10px;
        }
        .select-group {
            margin-bottom: 8px;
        }
        .select-label {
            font-size: 10px;
            color: var(--text-secondary);
            margin-bottom: 3px;
            display: block;
            font-weight: 700;
            text-transform: uppercase;
        }
        .dropdown {
            background: #1a2230;
            border: 1px solid var(--border-color);
            color: white;
            padding: 9px;
            border-radius: 8px;
            width: 100%;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .signal-btn {
            background: linear-gradient(135deg, #00c853, #009624);
            color: white;
            border: none;
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 200, 83, 0.3);
            margin-top: 4px;
            transition: opacity 0.2s;
        }
        .signal-btn:disabled {
            background: #2a3b4c;
            color: #8a9ba8;
            cursor: not-allowed;
            box-shadow: none;
        }
        /* Блок анализа в реальном времени */
        .analysis-loader {
            background: #17212f;
            border: 1px solid #283850;
            border-radius: 12px;
            padding: 14px;
            margin-top: 10px;
            display: none;
            text-align: center;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(41, 121, 255, 0.2);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loader-text {
            font-size: 12px;
            color: #b0bec5;
            font-weight: 600;
        }
        .signal-result {
            background: #17212f;
            border: 1px solid #283850;
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
            display: none;
        }
        .signal-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }
        .signal-action {
            font-size: 18px;
            font-weight: 900;
            color: var(--accent-green);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .analysis-list {
            font-size: 11px;
            color: #b0bec5;
            line-height: 1.4;
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
            margin-top: 8px;
        }
        .order-book {
            margin-top: 10px;
            background: #0f1520;
            padding: 8px;
            border-radius: 8px;
            font-size: 11px;
        }
        .order-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .progress-line {
            height: 4px;
            border-radius: 2px;
            background: #222b38;
            overflow: hidden;
            margin-bottom: 6px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-green), var(--accent-blue));
            width: 78%;
        }
        .trade-link-btn {
            display: block;
            background: var(--accent-blue);
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 12px;
            margin-top: 10px;
        }
        /* Всплывающие уведомления */
        #toast-container {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            z-index: 9999;
            pointer-events: none;
        }
        .toast {
            background: rgba(19, 24, 35, 0.96);
            border: 1px solid rgba(0, 200, 83, 0.4);
            backdrop-filter: blur(10px);
            color: white;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 11px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideUp 0.3s ease, fadeOut 0.3s ease 3.7s;
            pointer-events: auto;
            margin-bottom: 6px;
        }
        .toast-icon {
            background: rgba(0, 200, 83, 0.2);
            color: var(--accent-green);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
            font-size: 12px;
        }
        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .calc-input {
            width: 100%;
            background: #1a2230;
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 4px;
            margin-bottom: 8px;
        }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 11px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">BINODEX <span>AI PRO</span></div>
        <div class="badges-header">
            <div class="badge winrate-badge">99.1% WIN</div>
            <div class="badge ping-badge">ONLINE</div>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('terminal', this)">📊 ТЕРМИНАЛ</button>
        <button class="tab-btn" onclick="switchTab('history', this)">📜 ИСТОРИЯ СИГНАЛОВ</button>
        <button class="tab-btn" onclick="switchTab('calc', this)">🧮 РИСК-МЕНЕДЖЕР</button>
        <button class="tab-btn" onclick="switchTab('vip', this)">👑 ТОП ТРЭЙДЕРОВ</button>
    </div>

    <div id="terminal" class="tab-content active">
        <div class="news-filter">
            <span>🛡 НОВОСТНОЙ ФИЛЬТР: РЫНОК БЕЗОПАСЕН</span>
            <span class="news-status">STABLE</span>
        </div>

        <div class="card">
            <div class="select-group">
                <span class="select-label">ВЫБОР АКТИВА ДЛЯ ТРЭЙДИНГА</span>
                <select id="pairSelect" class="dropdown">
                    <option value="EUR/USD (OTC)">🇪🇺 EUR / USD (OTC) — Выплата 96%</option>
                    <option value="GBP/USD (OTC)">🇬🇧 GBP / USD (OTC) — Выплата 95%</option>
                    <option value="XAU/USD (ЗОЛОТО)">🥇 XAU / USD (ЗОЛОТО) — Выплата 97%</option>
                    <option value="BITCOIN (BTC/USDT)">₿ BITCOIN (BTC / USDT) — Выплата 98%</option>
                </select>
            </div>

            <div class="select-group">
                <span class="select-label">ЭКСПИРАЦИЯ СДЕЛИ</span>
                <select id="timeSelect" class="dropdown">
                    <option value="1 минута">⚡ 1 МИНУТА (СКАЛЬПИНГ)</option>
                    <option value="3 минуты" selected>⏱ 3 МИНУТЫ (ОПТИМАЛЬНО)</option>
                    <option value="5 минут">⏳ 5 МИНУТ (ТРЕНД)</option>
                </select>
            </div>

            <button id="signalBtn" class="signal-btn" onclick="startAnalysis()">⚡ ПОЛУЧИТЬ СИГНАЛ ОТ НЕЙРОСЕТИ</button>

            <div id="analysisLoader" class="analysis-loader">
                <div class="spinner"></div>
                <div id="loaderText" class="loader-text">Подключение к терминалу брокера...</div>
            </div>

            <div id="signalResult" class="signal-result">
                <div class="signal-header">
                    <span id="resImpulse">ИМПУЛЬС: 97.2%</span>
                    <span id="resAccuracy">ТОЧНОСТЬ: 99.4%</span>
                </div>
                <div class="signal-action"
