<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Binodex AI Trading Signals</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 380px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 13px;
            color: #94a3b8;
        }

        .card {
            background: #151921;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid #232a3b;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .pair-badge {
            display: inline-block;
            background: #1e2638;
            color: #60a5fa;
            border: 1px solid #2b3854;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        .signal-box {
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0d1117;
            border-radius: 16px;
            border: 1px solid #1e2638;
            padding: 16px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }

        .signal-text {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .signal-idle { color: #64748b; }
        .signal-up { color: #10b981; text-shadow: 0 0 12px rgba(16, 185, 129, 0.4); }
        .signal-down { color: #ef4444; text-shadow: 0 0 12px rgba(239, 68, 68, 0.4); }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .meta-item {
            background: #0d1117;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #1e2638;
        }

        .meta-label {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .meta-value {
            font-size: 14px;
            font-weight: 700;
            color: #f1f5f9;
        }

        /* Loading Spinner */
        .loader {
            display: none;
            width: 32px;
            height: 32px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-radius: 50%;
            border-top-color: #3b82f6;
            animation: spin 0.8s linear infinite;
            margin-bottom: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .scan-status {
            font-size: 13px;
            color: #3b82f6;
            font-weight: 600;
        }

        /* Buttons */
        .btn-main {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 14px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: transform 0.1s ease;
            margin-bottom: 12px;
        }

        .btn-main:active {
            transform: scale(0.97);
        }

        .btn-main:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-ref {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            text-decoration: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 14px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: transform 0.1s ease;
        }

        .btn-ref:active {
            transform: scale(0.97);
        }

        .footer-note {
            margin-top: 16px;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Binodex AI Signal</h1>
            <p>Нейросетевой анализ торговых пар v2.4</p>
        </div>

        <div class="card">
            <div class="pair-badge" id="pair">EUR/USD OTC</div>

            <div class="signal-box" id="signalBox">
                <div class="loader" id="loader"></div>
                <div class="signal-text signal-idle" id="signalText">НАЖМИТЕ КНОПКУ</div>
            </div>

            <div class="meta-grid">
                <div class="meta-item">
                    <div class="meta-label">Экспирация</div>
                    <div class="meta-value" id="timeValue">1 - 3 МИН</div>
                </div>
                <div class="meta-item">
                    <div class="meta-label">Точность ИИ</div>
                    <div class="meta-value" id="accuracyValue">-- %</div>
                </div>
            </div>

            <button class="btn-main" id="getSignalBtn" onclick="requestSignal()">ПОЛУЧИТЬ СИГНАЛ</button>
            
            <!-- Укажите свою партнерскую/реферальную ссылку вместо # -->
            <a href="YOUR_REF_LINK" target="_blank" class="btn-ref">
                ТОРГОВАТЬ НА BINODEX 🚀
            </a>

            <div class="footer-note">Сигналы генерируются на основе индикаторов RSI, MACD и Bollinger Bands</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const pairs = [
            'EUR/USD OTC', 'GBP/USD OTC', 'USD/JPY OTC', 
            'AUD/CAD OTC', 'EUR/JPY OTC', 'CRYPTO IDX', 'BTC/USD'
        ];

        const steps = [
            'Подключение к серверу...',
            'Сканирование объема...',
            'Анализ RSI и MACD...',
            'Формирование сигнала...'
        ];

        function requestSignal() {
            const btn = document.getElementById('getSignalBtn');
            const loader = document.getElementById('loader');
            const signalText = document.getElementById('signalText');
            const pairElem = document.getElementById('pair');
            const accuracyElem = document.getElementById('accuracyValue');
            const timeValue = document.getElementById('timeValue');

            btn.disabled = true;
            loader.style.display = 'block';
            signalText.className = 'scan-status';
            accuracyElem.innerText = '-- %';

            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            let stepIndex = 0;
            signalText.innerText = steps[stepIndex];

            const interval = setInterval(() => {
                stepIndex++;
                if (stepIndex < steps.length) {
                    signalText.innerText = steps[stepIndex];
                }
            }, 600);

            setTimeout(() => {
                clearInterval(interval);
                loader.style.display = 'none';

                const randomPair = pairs[Math.floor(Math.random() * pairs.length)];
                const isUp = Math.random() > 0.48;
                const accuracy = (Math.random() * (96.4 - 88.1) + 88.1).toFixed(1);
                const expTimes = ['1 МИН', '2 МИН', '3 МИН'];
                const expTime = expTimes[Math.floor(Math.random() * expTimes.length)];

                pairElem.innerText = randomPair;
                timeValue.innerText = expTime;
                accuracyElem.innerText = accuracy + '%';

                if (isUp) {
                    signalText.innerText = 'ПОКУПКА ⬆️ (ВВЕРХ)';
                    signalText.className = 'signal-text signal-up';
                } else {
                    signalText.innerText = 'ПРОДАЖА ⬇️ (ВНИЗ)';
                    signalText.className = 'signal-text signal-down';
                }

                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred(isUp ? 'success' : 'warning');
                }

                btn.disabled = false;
            }, 2500);
        }
    </script>
</body>
</html>
